name: super_brothers_carwash
description: "Super Brothers Carwash is a mobile application that allows users to book car wash services conveniently."
publish_to: 'none'
version: 1.0.0+1
workspace:
  - apps/super_brothers

environment:
  sdk: ">=3.13.0 <4.0.0"

dev_dependencies:
  melos: ^8.8.0

dependency_overrides:
  cli_util: ^0.6.0

melos:
  scripts:

    # ───────────────────────────────
    # 🧹 CORE
    # ───────────────────────────────
    clean:
      run: melos exec -- flutter clean

    get:
      run: melos exec -- flutter pub get

    format:
      run: melos exec -- dart format .

    analyze:
      run: melos exec -- flutter analyze

    setup:
      run: melos run clean && melos run get && melos run gen && melos run codegen

    # ───────────────────────────────
    # ⚙️ GENERATE
    # ───────────────────────────────
    gen:
      run: melos exec -- flutter gen-l10n

    codegen:
      run: melos exec -- dart run build_runner build --delete-conflicting-outputs
      packageFilters:
        dependsOn: build_runner

    splash:
      run: cd apps/super_brothers && flutter pub run flutter_native_splash:create

    # ───────────────────────────────
    # 🚀 RUN
    # ───────────────────────────────
    run:dev:
      run: cd apps/super_brothers && flutter run --flavor development -t lib/main_development.dart

    run:staging:
      run: cd apps/super_brothers && flutter run --flavor staging -t lib/main_staging.dart

    run:prod:
      run: cd apps/super_brothers && flutter run --flavor production -t lib/main_production.dart

    # ───────────────────────────────
    # 🤖 ANDROID - APK
    # ───────────────────────────────
    build:android:dev:
      run: cd apps/super_brothers && flutter build apk --release --flavor development -t lib/main_development.dart

    build:android:staging:
      run: cd apps/super_brothers && flutter build apk --release --flavor staging -t lib/main_staging.dart

    build:android:prod:
      run: cd apps/super_brothers && flutter build apk --release --flavor production -t lib/main_production.dart

    # Debug Build
    build:android:dev:debug:
      run: cd apps/super_brothers && flutter build apk --debug --flavor development -t lib/main_development.dart

    # ───────────────────────────────
    # 📦 ANDROID - AAB (Play Store)
    # ───────────────────────────────
    build:aab:dev:
      run: cd apps/super_brothers && flutter build appbundle --flavor development -t lib/main_development.dart

    build:aab:staging:
      run: cd apps/super_brothers && flutter build appbundle --flavor staging -t lib/main_staging.dart

    build:aab:prod:
      run: cd apps/super_brothers && flutter build appbundle --flavor production -t lib/main_production.dart

    # ───────────────────────────────
    # 🍏 iOS BUILD
    # ───────────────────────────────
    ios:dev:
      run: cd apps/super_brothers && flutter build ios --release --flavor development -t lib/main_development.dart

    ios:staging:
      run: cd apps/super_brothers && flutter build ios --release --flavor staging -t lib/main_staging.dart

    ios:prod:
      run: cd apps/super_brothers && flutter build ios --release --flavor production -t lib/main_production.dart
    
    # ───────────────────────────────
    # 🍏 IPA (App Store)
    # ───────────────────────────────
    build:ipa:dev:
      run: cd apps/super_brothers && flutter build ipa --release --flavor development -t lib/main_development.dart

    build:ipa:staging:
      run: cd apps/super_brothers && flutter build ipa --release --flavor staging -t lib/main_staging.dart

    build:ipa:prod:
      run: cd apps/super_brothers && flutter build ipa --release --flavor production -t lib/main_production.dart

    # ───────────────────────────────
    # 🧱 REBUILD SHORTCUTS
    # ───────────────────────────────
    rebuild:dev:
      run: melos run clean && melos run build:android:dev

    rebuild:staging:
      run: melos run clean && melos run build:android:staging

    rebuild:prod:
      run: melos run clean && melos run build:android:prod