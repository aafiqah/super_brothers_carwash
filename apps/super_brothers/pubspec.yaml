name: super_brothers
description: "Super Brothers is a mobile application that allows users to book car wash services conveniently."
publish_to: 'none'
version: 1.0.0+1
resolution: workspace

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: 
    sdk: flutter
  intl: 0.20.3
  shared_preferences: ^2.5.5
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  flutter_bloc: ^9.1.1
  go_router: ^18.0.1
  json_annotation: ^4.11.0
  flutter_svg: ^2.2.1
  dio: ^5.11.1
  equatable: ^3.0.0
  pretty_dio_logger: ^1.4.0
  flutter_widget_from_html: ^0.17.4
  shimmer: ^4.0.0
  pretty_qr_code: ^3.5.0
  image_picker: ^1.2.3
  carousel_slider: ^5.1.1
  visibility_detector: ^0.4.0+2
  flutter_native_splash: ^2.4.8
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.16.1
  freezed: ^4.0.2
  json_serializable: ^6.14.1

flutter:
  generate: true
  uses-material-design: true

  config:
    enable-swift-package-manager: true
  
  assets:
    - assets/images/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/app_logo.png"
  # adaptive_icon_foreground: "assets/images/logo_light.png"
  adaptive_icon_background: "assets/images/background_logo.png"
  adaptive_icon_monochrome: "assets/images/app_monochrome_logo.png"

flutter_native_splash:
  color: "#FFFFFF"        # Light mode background color
  color_dark: "#1A1A1A"   # Dark mode background color
  image: assets/images/app_logo.png         # Light mode center logo
  image_dark: assets/images/app_logo.png    # Dark mode center logo (can change if needed)
  android: true
  ios: true
  # Safe area padding so image is centered better
  ios_content_mode: center
  android_gravity: center
